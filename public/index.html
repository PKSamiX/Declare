<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2329">
<title>Declare</title>
<style>
:root{
  --bg:#e9eef0; --table:#17323a; --table2:#0f2329; --ink:#1b1f2a; --red:#cf3340; --jk:#6b3fa0;
  --face:#fbfbf8; --back:#e0a93b; --back2:#b8821f; --text:#f3f1ea; --muted:#9fb6bc; --accent:#e0a93b;
  color-scheme: light dark;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0b1519; --table:#132a31; --table2:#0b191e; } }
:root[data-theme="dark"]{ --bg:#0b1519; --table:#132a31; --table2:#0b191e; }
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"Trebuchet MS","Segoe UI",Tahoma,Roboto,sans-serif}
#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 40%,var(--table),var(--table2));padding:10px 0;position:relative;overflow:hidden}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 16px}
h1{font-family:Georgia,"Times New Roman",serif;font-size:22px;margin:0}
.rule{font-size:12px;color:var(--muted)}
.hb{display:flex;align-items:center;gap:6px}
.hb button{padding:2px 10px;min-height:30px;font-size:12px}
#scores{display:flex;flex-wrap:wrap;gap:6px;padding:8px 16px 0}
.sc{flex:1 1 64px;background:rgba(255,255,255,.08);border-radius:10px;padding:5px 8px;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc b{display:block;font-size:20px;color:var(--text)}
.sc.turn,.chip.turn{outline:2px solid var(--accent)}
#cpus{display:flex;flex-wrap:wrap;gap:6px;padding:8px 16px 0}
.chip{font-size:12px;background:rgba(255,255,255,.08);border-radius:8px;padding:4px 8px;color:var(--muted)}
.card{width:64px;height:92px;flex:none;border-radius:9px;border:1px solid #c9c7bd;background:var(--face);color:var(--ink);display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:3px;padding:7px 8px;font-family:Georgia,serif;font-size:22px;line-height:1;box-shadow:0 2px 6px rgba(0,0,0,.35);margin-left:-10px;transition:transform .15s}
.card i{font-style:normal;font-size:30px;align-self:flex-start}
.card.red{color:var(--red)} .card.jk{color:var(--jk)}
.card.back{background:repeating-linear-gradient(45deg,var(--back),var(--back) 6px,var(--back2) 6px,var(--back2) 12px);border:3px solid var(--face)}
.card.use{transform:translateY(-10px);box-shadow:0 0 0 2px var(--accent),0 4px 10px rgba(0,0,0,.4)}
.card.sel{transform:translateY(-10px);box-shadow:0 0 0 3px #ff8a93}
.card.pick{box-shadow:0 0 0 2px var(--accent)}
button.card{cursor:pointer}
button.card:disabled{cursor:default;opacity:1}
.card.sm{width:52px;height:74px;font-size:17px;padding:5px 6px;gap:2px;margin-left:-6px}
.card.sm i{font-size:24px}
.fan,.piles,.tbl,#hand{direction:ltr}
.fan{display:flex}
#mid{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;padding:0 16px}
.piles{display:flex;gap:18px;align-items:center;justify-content:center;width:100%;margin-top:22px}
.pile{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.pile .card{margin:0}
.ptr{position:absolute;top:-26px;left:50%;transform:translateX(-50%);font-size:24px;line-height:1;color:var(--accent);animation:bob .8s ease-in-out infinite}
.ptr[hidden]{display:none}
@keyframes bob{50%{transform:translateX(-50%) translateY(7px)}}
.tbl{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;max-height:180px;overflow:auto;min-height:74px;padding:3px}
.tbl .card{margin:0}
#msg{min-height:40px;text-align:center;font-size:15px}
.bar{display:flex;gap:8px;justify-content:center;padding:4px 16px;flex-wrap:wrap}
button.act{font:inherit;font-weight:700;border:0;border-radius:99px;padding:10px 16px;background:var(--accent);color:#2a2008;cursor:pointer;min-height:44px}
button.act.alt{background:rgba(255,255,255,.14);color:var(--text)}
button.act:disabled{opacity:.35;cursor:default}
.label{font-size:13px;color:var(--muted);padding:2px 16px}
#hand{display:flex;flex-wrap:wrap;justify-content:center;gap:0;padding:16px 12px 6px;min-height:118px;max-height:210px;overflow:auto}
#hand .card{margin-left:-14px}#hand .card:first-child{margin-left:0}#hand.many{gap:4px}#hand.many .card{margin-left:0}
.overlay[hidden]{display:none}
.overlay{position:absolute;inset:0;background:rgba(6,14,17,.93);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:14px;text-align:center;padding:20px;overflow:auto}
.overlay>:first-child{margin-top:auto}.overlay>:last-child{margin-bottom:auto}
.overlay h2{font-family:Georgia,serif;font-size:26px;margin:0}
.row{width:100%;max-width:420px;text-align:start;background:rgba(255,255,255,.07);border-radius:12px;padding:10px 12px}
.row.win{outline:2px solid var(--accent)}
.row .fan{padding:6px 0 2px 6px;flex-wrap:wrap;row-gap:4px}
.row small{color:var(--muted)}
input{font:inherit;padding:12px 14px;border-radius:12px;border:0;width:100%;max-width:320px;text-align:center;background:var(--face);color:var(--ink)}
.code{font-family:Georgia,serif;font-size:52px;letter-spacing:8px;font-weight:700;color:var(--accent);padding-inline-start:8px;direction:ltr}
.err{color:#ff8a93;min-height:20px;font-size:14px}
:focus-visible{outline:3px solid #fff;outline-offset:2px}
@media (prefers-reduced-motion:reduce){.card{transition:none}.ptr{animation:none}}
</style>
</head>

  <div class="rule" id="rule1" style="padding:2px 16px 0"></div>

function t(k,p){
  var s=TX[LANG][k];if(s===undefined)s=TX.en[k];if(s===undefined)return k;
  return p?s.replace(/\{(\w+)\}/g,function(m,x){return p[x]===undefined?'':p[x]}):s;
}
function cp(k){
  if(LANG==='ar')return k===1?'ورقة':k===2?'ورقتين':(k>=3&&k<=10)?k+' أوراق':k+' ورقة';
  return k===1?'1 card':k+' cards';
}

function nm(c){return c.j?t('joker'):c.r+c.s}
function errText(k){return t('e_'+k)}
function best(h){
  var jk=h.filter(function(c){return c.j}).length,b={s:'♠',t:-1};
  SUITS.forEach(function(s){var x=h.reduce(function(a,c){return a+(c.s===s?c.v:0)},0)+jk*11;if(x>b.t)b={s:s,t:x}});
  b.t=Math.min(54,b.t);return b;
}

function toggleSound(){MUTE=!MUTE;$('snb').textContent=t(MUTE?'sndOff':'sndOn')}
function snd(k){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    if(MUTE||k==='init')return;
    var tm=AC.currentTime,dr=k==='draw',len=dr?.16:.1,n=Math.floor(AC.sampleRate*len),b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);
    for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(dr?Math.sin(Math.PI*i/n):Math.pow(1-i/n,4));

    s.buffer=b;f.type='bandpass';f.Q.value=.9;g.gain.value=dr?.35:.7;
    f.frequency.setValueAtTime(dr?1500:1800,tm);if(dr)f.frequency.linearRampToValueAtTime(5000,tm+len);
    s.connect(f);f.connect(g);g.connect(AC.destination);s.start(tm);
    if(!dr){var o=AC.createOscillator(),og=AC.createGain();o.frequency.setValueAtTime(200,tm);o.frequency.exponentialRampToValueAtTime(70,tm+.08);og.gain.setValueAtTime(.35,tm);og.gain.exponentialRampToValueAtTime(.001,tm+.1);o.connect(og);og.connect(AC.destination);o.start(tm);o.stop(tm+.12)}
  }catch(e){}
}
function face(c,cls,att){
  return '<button class="card '+(c.j?'jk ':red(c.s)?'red ':'')+(cls||'')+'" '+(att||'disabled tabindex="-1"')+' aria-label="'+esc(nm(c))+'"><span>'+c.r+'</span><i>'+c.s+'</i></button>';
}
function save(){SAVED={code:CODE,pid:PID,name:NAME};try{localStorage.setItem('declare',JSON.stringify(SAVED))}catch(e){}}
function toHome(){clearTimeout(CT);if(ES)ES.close();ES=null;S=null;PREV=null;CODE='';PID='';if(!PRE&&SAVED)PRE=SAVED.code;render()}
function forget(){try{localStorage.removeItem('declare')}catch(e){}SAVED=null;toHome()}
function rejoin(){if(!SAVED)return;CODE=SAVED.code;PID=SAVED.pid;err='';snd('init');connect();render()}
function post(path,body){
  return fetch('/api/'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(function(r){return r.json()}).catch(function(){return {error:'net'}});
}
function connect(){
  if(ES)ES.close();
  clearTimeout(CT);CT=setTimeout(function(){if(!S){err='conn';toHome()}},12000);
  ES=new EventSource('/api/events?code='+encodeURIComponent(CODE)+'&pid='+encodeURIComponent(PID));
  ES.onmessage=function(e){onState(JSON.parse(e.data))};
  ES.onerror=function(){if(ES.readyState===2){err='gone';forget()}};
}
function readInputs(){NAME=$('nm')?$('nm').value:NAME;PRE=$('cd')?$('cd').value:PRE}
function create(){readInputs();snd('init');post('create',{name:NAME}).then(joined)}
function join(){readInputs();snd('init');post('join',{name:NAME,code:PRE}).then(joined)}
function joined(r){if(r.error){err=r.error;render();return}CODE=r.code;PID=r.pid;err='';save();connect();render()}
function act(type,extra){
  var b={code:CODE,pid:PID,type:type};for(var k in extra)b[k]=extra[k];
  post('act',b).then(function(r){if(r&&r.error){err=r.error;render();setTimeout(function(){err='';render()},2500)}});
}
function onState(s){
  PREV=S;S=s;sel=[];mode='';
  if(PREV&&PREV.round===S.round&&S.phase==='turn'&&PREV.phase==='turn'){
    if(S.table.length>PREV.table.length)snd('throw');
    else if(S.deck<PREV.deck||S.table.length<PREV.table.length)snd('draw');
  }
  render();
}
function copyLink(){
  var url=location.origin+'/?code='+S.code;
  if(navigator.share){navigator.share({title:'Declare',text:t('share',{c:S.code}),url:url}).catch(function(){});return}
  if(navigator.clipboard){navigator.clipboard.writeText(url).then(function(){err='copied';render();setTimeout(function(){err='';render()},1800)},function(){})}
}
function homeHtml(){
  return langBtn()+'<h2>Declare</h2><div class="rule">'+t('h_sub')+'</div>'+
    (SAVED?'<button class="act" onclick="rejoin()">'+t('h_rejoin',{c:esc(SAVED.code)})+'</button><div class="rule">'+t('h_fresh')+'</div>':'')+
    '<input id="nm" placeholder="'+t('h_name')+'" maxlength="14" autocomplete="off" value="'+esc(NAME)+'">'+
    '<button class="act" onclick="create()">'+t('h_create')+'</button>'+
    '<div class="rule">'+t('h_or')+'</div>'+
    '<input id="cd" placeholder="'+t('h_code')+'" maxlength="4" autocomplete="off" autocapitalize="characters" style="text-transform:uppercase" value="'+esc(PRE)+'">'+
    '<button class="act alt" onclick="join()">'+t('h_join')+'</button><div class="err">'+(err?errText(err):'')+'</div>';
}
function lobbyHtml(){
  var host=S.you===0,n=S.players.length;
  return langBtn()+'<h2>'+t('l_title')+'</h2><div class="code">'+esc(S.code)+'</div>'+
    '<div class="rule">'+t('l_give')+'</div>'+
    '<button class="act alt" onclick="copyLink()">'+t('l_share')+'</button>'+
    S.players.map(function(x,i){return '<div class="row"><b>'+bdi(x.name)+'</b> <small>'+(i===0?t('l_host'):'')+(i===S.you?t('l_you'):'')+(x.on?t('l_on'):t('l_off'))+'</small></div>'}).join('')+
    '<div class="rule">'+t('l_count',{n:n})+'</div>'+
    '<div class="rule">'+t('l_deck',{n:n,d:n>4?104:52,j:n<=5?2:n===6?3:4})+'</div>'+
    (host?'<button class="act" onclick="act(\'start\')"'+(n<2?' disabled':'')+'>'+t('l_start')+'</button>':'<div class="rule">'+t('l_wait')+'</div>')+
    '<div class="err">'+(err?errText(err):'')+'</div>';
}
function promptHtml(){
  var b=best(S.hand),k=S.call.kind==='double';
  return '<h2>'+(k?t('p_decl',{n:bdi(S.players[S.declarer].name)}):t('p_dbl',{n:bdi(S.players[S.parts[1]].name)}))+'</h2>'+
    '<div>'+t('p_best',{s:b.s,t:'<b>'+b.t+'</b>'})+'</div>'+
    '<div class="rule">'+(k?t('p_dblHelp'):t('p_trpHelp'))+t('p_auto')+'</div>'+
    '<div class="bar"><button class="act" onclick="act(\'call\',{yes:true})">'+(k?t('p_double'):t('p_triple'))+'</button>'+
    '<button class="act alt" onclick="act(\'call\',{yes:false})">'+t('p_pass')+'</button></div>';
}
function revealHtml(){
  var r=S.res,roles=[t('r_decl'),t('r_dbl'),t('r_trp')];
  var rows=S.players.map(function(x,p){
    var ix=r.parts.indexOf(p),bt=best(x.hand||[]);
    return '<div class="row'+(p===r.w?' win':'')+'"><b>'+bdi(x.name)+'</b> <small>'+(r.de?t('r_show'):ix>=0?roles[ix]:t('r_sat'))+' · '+bt.s+' '+bt.t+'</small><div class="fan">'+
      (x.hand||[]).map(function(c){return face(c,'sm'+((c.j||c.s===bt.s)?' use':''))}).join('')+'</div></div>';
  }).join('');
  var line=r.pts?t('r_win',{n:bdi(S.players[r.w].name),t:r.t,m:r.mult,p:r.pts}):t('r_none');
  return '<h2>'+line+'</h2>'+(r.de?'<div class="rule">'+t('r_de')+'</div>':'')+rows+
    '<button class="act" onclick="act(\'next\')">'+(S.round>=S.rounds?t('r_final'):t('r_next'))+'</button>'+'<div class="err">'+(err?errText(err):'')+'</div>';
}
function finalHtml(){
  var P=S.players.map(function(x,i){return {n:x.name,s:x.score,i:i}}),mx=Math.max.apply(null,P.map(function(x){return x.s}));
  var w=P.filter(function(x){return x.s===mx});
  var ti=w.length>1?t('f_tie',{n:w.map(function(x){return bdi(x.n)}).join(t('f_and'))}):t('f_win',{n:bdi(w[0].n)});
  return langBtn()+'<h2>'+ti+'</h2>'+P.slice().sort(function(a,b){return b.s-a.s}).map(function(x){return '<div class="row'+(x.s===mx?' win':'')+'">'+t('f_pts',{n:'<b>'+bdi(x.n)+'</b>',s:x.s})+'</div>'}).join('')+
    (S.you===0?'<button class="act" onclick="act(\'again\')">'+t('f_again')+'</button>':'<div class="rule">'+t('f_wait')+'</div>');
}
function render(){
  var ov=$('ov');
  if(!S){ov.hidden=false;ov.innerHTML=PID?'<h2>'+t('c_title')+'</h2><div class="rule">'+t('c_sub')+'</div><button class="act alt" onclick="toHome()">'+t('c_back')+'</button>':homeHtml();return}
  if(S.phase==='lobby'){ov.hidden=false;ov.innerHTML=lobbyHtml();return}
  var me=S.you,P=S.players,tm=S.phase==='turn'&&S.turn===me,mine=tm&&S.step==='act',disc=tm&&S.step==='throw',need=S.pend,k=S.table.length,pk=mode==='pickone';
  $('rnd').textContent=t('round',{a:Math.min(S.round,S.rounds),b:S.rounds});
  $('scores').innerHTML=P.map(function(x,p){
    return '<div class="sc'+(S.phase==='turn'&&S.turn===p?' turn':'')+'">'+bdi(x.name)+(p===me?' '+t('you'):'')+'<b>'+x.score+'</b></div>';
  }).join('');
  $('cpus').innerHTML=P.map(function(x,p){
    return p===me?'':'<div class="chip'+(S.phase==='turn'&&S.turn===p?' turn':'')+'">'+t('chip',{n:bdi(x.name),c:cp(x.count)})+(x.on?'':t('off'))+'</div>';
  }).join('');
  $('deckN').textContent=t('deckN',{n:S.deck});
  $('top').innerHTML=k?S.table.map(function(c,i){return face(c,'sm'+(pk?' pick':''),pk&&mine?'onclick="act(\'takeOne\',{i:'+i+'})"':'')}).join(''):'<span class="rule">'+t('tableEmpty')+'</span>';
  $('tblN').textContent=t('tableN',{n:k});
  var m=err?errText(err):(pk?t('hintPick'):fmtMsg(S.msg));
  if(!err&&!pk){
    if(mine)m+=' '+t('hintMine');
    else if(disc)m+=' '+(need>1?t('hintThrowN',{c:cp(need)}):t('hintThrow1'));
    else if(S.phase==='call'&&S.call&&!S.call.mine)m+=' '+t('hintWait');
  }
  $('msg').textContent=m;
  var h=S.hand,b=best(h);
  $('tot').textContent=t('best',{s:b.s,t:b.t})+t(b.t>=40?'bestOk':'bestNeed');
  $('hand').className=h.length>6?'many':'';
  $('hand').innerHTML=h.map(function(c,i){
    var cls=(disc&&need>1)?(sel.indexOf(i)>=0?'sel':''):((c.j||c.s===b.s)?'use':'');
    return face(c,cls+(h.length>6?' sm':''),disc?'onclick="hDiscard('+i+')"':'');
  }).join('');
  var bar='';
  if(mine){
    if(S.deck)bar+='<button class="act" onclick="act(\'draw\')">'+t('draw')+(k>=5?t('wipes'):'')+'</button>';
    if(k>0&&k<5)bar+='<button class="act alt" onclick="act(\'takeAll\')">'+(k===1?t('takeCard'):t('takeCards',{c:cp(k)}))+'</button>';
    if(k>=5)bar+='<button class="act alt" onclick="act(\'takeAll\')">'+t('takeAll',{k:k})+'</button><button class="act alt" onclick="mode=\'pickone\';render()">'+t('takeOne')+'</button>';
    bar+='<button class="act alt" onclick="act(\'declare\')"'+(b.t<40||h.length!==5?' disabled':'')+'>'+t('declare')+'</button>';
  }else if(disc&&need>1){
    bar='<button class="act" onclick="hThrow()"'+(sel.length===need?'':' disabled')+'>'+t('throwBtn',{a:sel.length,b:need})+'</button>';
  }
  $('bar').innerHTML=bar;$('ptr').hidden=!mine;
  if(S.phase==='call'&&S.call&&S.call.mine){ov.hidden=false;ov.innerHTML=promptHtml()}
  else if(S.phase==='reveal'){ov.hidden=false;ov.innerHTML=revealHtml()}
  else if(S.phase==='final'){ov.hidden=false;ov.innerHTML=finalHtml()}
  else ov.hidden=true;
}
function hDiscard(i){
  if(S.pend===1){act('throw',{idx:[i]});return}
  var j=sel.indexOf(i);if(j>=0)sel.splice(j,1);else if(sel.length<S.pend)sel.push(i);render();
}
function hThrow(){if(sel.length===S.pend)act('throw',{idx:sel.slice()})}
(function(){
  try{var l=localStorage.getItem('declare_lang');LANG=l||((navigator.language||'').slice(0,2)==='ar'?'ar':'en')}catch(e){}
  var q=new URLSearchParams(location.search).get('code');if(q)PRE=q.toUpperCase().slice(0,4);
  try{var o=JSON.parse(localStorage.getItem('declare'));if(o){NAME=o.name||'';if(o.code&&o.pid){SAVED={code:o.code,pid:o.pid,name:NAME};if(!PRE)PRE=o.code}}}catch(e){}
  document.addEventListener('visibilitychange',function(){if(document.hidden)HID=Date.now();else if(S&&HID&&Date.now()-HID>5000){HID=0;err='';toHome()}});
  window.addEventListener('pageshow',function(e){if(e.persisted&&S)toHome()});
  applyLang();render();
})();
</script>
</body>
</html>
