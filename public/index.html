<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2329">
<title>Declare</title>
<style>
:root{
  --bg:#e9eef0; --table:#17323a; --table2:#0f2329; --ink:#1b1f2a; --red:#cf3340; --jk:#6b3fa0;
  --face:#fbfbf8; --back:#e0a93b; --back2:#b8821f; --text:#f3f1ea; --muted:#9fb6bc; --accent:#e0a93b;
  color-scheme: light dark;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0b1519; --table:#132a31; --table2:#0b191e; } }
:root[data-theme="dark"]{ --bg:#0b1519; --table:#132a31; --table2:#0b191e; }
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"Trebuchet MS","Segoe UI",Roboto,sans-serif}
#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 40%,var(--table),var(--table2));padding:10px 0;position:relative;overflow:hidden}
header{display:flex;justify-content:space-between;align-items:baseline;padding:0 16px}
h1{font-family:Georgia,"Times New Roman",serif;font-size:22px;margin:0}
.rule{font-size:12px;color:var(--muted)}
#scores{display:flex;flex-wrap:wrap;gap:6px;padding:8px 16px 0}
.sc{flex:1 1 64px;background:rgba(255,255,255,.08);border-radius:10px;padding:5px 8px;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc b{display:block;font-size:20px;color:var(--text)}
.sc.turn,.chip.turn{outline:2px solid var(--accent)}
#cpus{display:flex;flex-wrap:wrap;gap:6px;padding:8px 16px 0}
.chip{font-size:12px;background:rgba(255,255,255,.08);border-radius:8px;padding:4px 8px;color:var(--muted)}
.card{width:64px;height:92px;flex:none;border-radius:9px;border:1px solid #c9c7bd;background:var(--face);color:var(--ink);display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:3px;padding:7px 8px;font-family:Georgia,serif;font-size:22px;line-height:1;box-shadow:0 2px 6px rgba(0,0,0,.35);margin-left:-10px;transition:transform .15s}
.card i{font-style:normal;font-size:30px;align-self:flex-start}
.card.red{color:var(--red)} .card.jk{color:var(--jk)}
.card.back{background:repeating-linear-gradient(45deg,var(--back),var(--back) 6px,var(--back2) 6px,var(--back2) 12px);border:3px solid var(--face)}
.card.use{transform:translateY(-10px);box-shadow:0 0 0 2px var(--accent),0 4px 10px rgba(0,0,0,.4)}
.card.sel{transform:translateY(-10px);box-shadow:0 0 0 3px #ff8a93}
.card.pick{box-shadow:0 0 0 2px var(--accent)}
button.card{cursor:pointer}
button.card:disabled{cursor:default;opacity:1}
.card.sm{width:52px;height:74px;font-size:17px;padding:5px 6px;gap:2px;margin-left:-6px}
.card.sm i{font-size:24px}
.fan{display:flex}
#mid{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;padding:0 16px}
.piles{display:flex;gap:18px;align-items:center;justify-content:center;width:100%;margin-top:22px}
.pile{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.pile .card{margin:0}
.ptr{position:absolute;top:-26px;left:50%;transform:translateX(-50%);font-size:24px;line-height:1;color:var(--accent);animation:bob .8s ease-in-out infinite}
.ptr[hidden]{display:none}
@keyframes bob{50%{transform:translateX(-50%) translateY(7px)}}
.tbl{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;max-height:180px;overflow:auto;min-height:74px;padding:3px}
.tbl .card{margin:0}
#msg{min-height:40px;text-align:center;font-size:15px}
.bar{display:flex;gap:8px;justify-content:center;padding:4px 16px;flex-wrap:wrap}
button.act{font:inherit;font-weight:700;border:0;border-radius:99px;padding:10px 16px;background:var(--accent);color:#2a2008;cursor:pointer;min-height:44px}
button.act.alt{background:rgba(255,255,255,.14);color:var(--text)}
button.act:disabled{opacity:.35;cursor:default}
.label{font-size:13px;color:var(--muted);padding:2px 16px}
#hand{display:flex;flex-wrap:wrap;justify-content:center;gap:0;padding:16px 12px 6px;min-height:118px;max-height:210px;overflow:auto}
#hand .card{margin-left:-14px}#hand .card:first-child{margin-left:0}#hand.many{gap:4px}#hand.many .card{margin-left:0}
.overlay[hidden]{display:none}
.overlay{position:absolute;inset:0;background:rgba(6,14,17,.93);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:14px;text-align:center;padding:20px;overflow:auto}
.overlay>:first-child{margin-top:auto}.overlay>:last-child{margin-bottom:auto}
.overlay h2{font-family:Georgia,serif;font-size:26px;margin:0}
.row{width:100%;max-width:420px;text-align:left;background:rgba(255,255,255,.07);border-radius:12px;padding:10px 12px}
.row.win{outline:2px solid var(--accent)}
.row .fan{padding:6px 0 2px 6px;flex-wrap:wrap;row-gap:4px}
.row small{color:var(--muted)}
input{font:inherit;padding:12px 14px;border-radius:12px;border:0;width:100%;max-width:320px;text-align:center;background:var(--face);color:var(--ink)}
.code{font-family:Georgia,serif;font-size:52px;letter-spacing:8px;font-weight:700;color:var(--accent);padding-left:8px}
.err{color:#ff8a93;min-height:20px;font-size:14px}
:focus-visible{outline:3px solid #fff;outline-offset:2px}
@media (prefers-reduced-motion:reduce){.card{transition:none}.ptr{animation:none}}
</style>
</head>
<body>
<div id="app">
  <header><h1>Declare</h1><div><span class="rule" id="rnd"></span> <button class="act alt" id="snb" onclick="MUTE=!MUTE;this.textContent=MUTE?'Sound off':'Sound on'" style="padding:2px 10px;min-height:30px;font-size:12px">Sound on</button></div></header>
  <div class="rule" style="padding:2px 16px 0">Collect one suit. Jokers count in any suit. You need 40 to score. Maximum 54.</div>
  <div id="scores"></div>
  <div id="cpus"></div>
  <div id="mid">
    <div class="piles">
      <div class="pile"><div class="ptr" id="ptr" hidden aria-hidden="true">▼</div><div class="card back" aria-hidden="true"></div><span id="deckN"></span></div>
      <div class="pile" style="flex:1;max-width:330px;align-items:center"><div class="tbl" id="top"></div><span id="tblN"></span></div>
    </div>
    <div id="msg" role="status" aria-live="polite"></div>
  </div>
  <div class="bar" id="bar"></div>
  <div class="label" id="tot"></div>
  <div id="hand"></div>
  <div id="ov" class="overlay" hidden></div>
</div>
<script>
var SUITS=['♠','♥','♦','♣'];
var S=null,PREV=null,CODE='',PID='',NAME='',PRE='',ES=null,sel=[],mode='',err='',MUTE=false,AC=null;
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function red(s){return s==='♥'||s==='♦'}
function nm(c){return c.j?'a Joker':c.r+c.s}
function best(h){
  var jk=h.filter(function(c){return c.j}).length,b={s:'♠',t:-1};
  SUITS.forEach(function(s){var t=h.reduce(function(a,c){return a+(c.s===s?c.v:0)},0)+jk*11;if(t>b.t)b={s:s,t:t}});
  b.t=Math.min(54,b.t);return b;
}
function snd(k){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    if(MUTE||k==='init')return;
    var t=AC.currentTime,dr=k==='draw',len=dr?.16:.1,n=Math.floor(AC.sampleRate*len),b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);
    for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(dr?Math.sin(Math.PI*i/n):Math.pow(1-i/n,4));
    var s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
    s.buffer=b;f.type='bandpass';f.Q.value=.9;g.gain.value=dr?.35:.7;
    f.frequency.setValueAtTime(dr?1500:1800,t);if(dr)f.frequency.linearRampToValueAtTime(5000,t+len);
    s.connect(f);f.connect(g);g.connect(AC.destination);s.start(t);
    if(!dr){var o=AC.createOscillator(),og=AC.createGain();o.frequency.setValueAtTime(200,t);o.frequency.exponentialRampToValueAtTime(70,t+.08);og.gain.setValueAtTime(.35,t);og.gain.exponentialRampToValueAtTime(.001,t+.1);o.connect(og);og.connect(AC.destination);o.start(t);o.stop(t+.12)}
  }catch(e){}
}
function face(c,cls,att){
  return '<button class="card '+(c.j?'jk ':red(c.s)?'red ':'')+(cls||'')+'" '+(att||'disabled tabindex="-1"')+' aria-label="'+nm(c)+'"><span>'+c.r+'</span><i>'+c.s+'</i></button>';
}
function save(){try{localStorage.setItem('declare',JSON.stringify({code:CODE,pid:PID,name:NAME}))}catch(e){}}
function forget(){try{localStorage.removeItem('declare')}catch(e){}CODE='';PID='';S=null;PREV=null;if(ES)ES.close();render()}
function post(path,body){
  return fetch('/api/'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(function(r){return r.json()}).catch(function(){return {error:'Cannot reach the server. It may be waking up: wait a minute and try again.'}});
}
function connect(){
  if(ES)ES.close();
  ES=new EventSource('/api/events?code='+encodeURIComponent(CODE)+'&pid='+encodeURIComponent(PID));
  ES.onmessage=function(e){onState(JSON.parse(e.data))};
  ES.onerror=function(){if(ES.readyState===2){err='That game is no longer available.';forget()}};
}
function readInputs(){NAME=$('nm')?$('nm').value:NAME;PRE=$('cd')?$('cd').value:PRE}
function create(){readInputs();snd('init');post('create',{name:NAME}).then(joined)}
function join(){readInputs();snd('init');post('join',{name:NAME,code:PRE}).then(joined)}
function joined(r){if(r.error){err=r.error;render();return}CODE=r.code;PID=r.pid;err='';save();connect();render()}
function act(type,extra){
  var b={code:CODE,pid:PID,type:type};for(var k in extra)b[k]=extra[k];
  post('act',b).then(function(r){if(r&&r.error){err=r.error;render();setTimeout(function(){err='';render()},2500)}});
}
function onState(s){
  PREV=S;S=s;sel=[];mode='';
  if(PREV&&PREV.round===S.round&&S.phase==='turn'&&PREV.phase==='turn'){
    if(S.table.length>PREV.table.length)snd('throw');
    else if(S.deck<PREV.deck||S.table.length<PREV.table.length)snd('draw');
  }
  render();
}
function copyLink(){
  var url=location.origin+'/?code='+S.code;
  if(navigator.share){navigator.share({title:'Declare',text:'Join my Declare game. Code: '+S.code,url:url}).catch(function(){});return}
  if(navigator.clipboard){navigator.clipboard.writeText(url).then(function(){err='Link copied.';render();setTimeout(function(){err='';render()},1800)},function(){})}
}
function homeHtml(){
  return '<h2>Declare</h2><div class="rule">Play online with friends and family. Only people who join take part, and no computer players are added.</div>'+
    '<input id="nm" placeholder="Your name" maxlength="14" autocomplete="off" value="'+esc(NAME)+'">'+
    '<button class="act" onclick="create()">Create a game</button>'+
    '<div class="rule">or join a friend’s game with its code</div>'+
    '<input id="cd" placeholder="CODE" maxlength="4" autocomplete="off" autocapitalize="characters" style="text-transform:uppercase" value="'+esc(PRE)+'">'+
    '<button class="act alt" onclick="join()">Join game</button><div class="err">'+esc(err)+'</div>';
}
function lobbyHtml(){
  var host=S.you===0,n=S.players.length;
  return '<h2>Game code</h2><div class="code">'+esc(S.code)+'</div>'+
    '<div class="rule">Give this code to the people you want to play with, or send them the link.</div>'+
    '<button class="act alt" onclick="copyLink()">Share invite link</button>'+
    S.players.map(function(x,i){return '<div class="row"><b>'+esc(x.name)+'</b> <small>'+(i===0?'host · ':'')+(i===S.you?'you · ':'')+(x.on?'online':'offline')+'</small></div>'}).join('')+
    '<div class="rule">'+n+' of 10 players joined. 2 to 10 can play.</div>'+
    (host?'<button class="act" onclick="act(\'start\')"'+(n<2?' disabled':'')+'>Start game</button>':'<div class="rule">Waiting for the host to start…</div>')+
    '<div class="err">'+esc(err)+'</div>';
}
function promptHtml(){
  var b=best(S.hand),k=S.call.kind==='double';
  return '<h2>'+(k?esc(S.players[S.declarer].name)+' declared':esc(S.players[S.parts[1]].name)+' called Double')+'</h2>'+
    '<div>Your best suit: <b>'+b.s+' '+b.t+'</b></div>'+
    '<div class="rule">'+(k?'Call Double if you think you have more than the declarer. The winner scores double.':'Call Triple if you think you have more than both. The winner scores triple.')+' Unanswered calls pass after 25 seconds.</div>'+
    '<div class="bar"><button class="act" onclick="act(\'call\',{yes:true})">'+(k?'Double':'Triple')+'</button>'+
    '<button class="act alt" onclick="act(\'call\',{yes:false})">Pass</button></div>';
}
function revealHtml(){
  var r=S.res,roles=['Declared','Doubled','Tripled'];
  var rows=S.players.map(function(x,p){
    var ix=r.parts.indexOf(p),bt=best(x.hand||[]);
    return '<div class="row'+(p===r.w?' win':'')+'"><b>'+esc(x.name)+'</b> <small>'+(r.de?'Showdown':ix>=0?roles[ix]:'Sat out')+' · '+bt.s+' '+bt.t+'</small><div class="fan">'+
      (x.hand||[]).map(function(c){return face(c,'sm'+((c.j||c.s===bt.s)?' use':''))}).join('')+'</div></div>';
  }).join('');
  var wn=esc(S.players[r.w].name);
  var line=r.pts?wn+' wins '+r.t+' × '+r.mult+' = '+r.pts+' points':'No points: the best total is under 40';
  return '<h2>'+line+'</h2>'+(r.de?'<div class="rule">The deck ran out, so the round ended.</div>':'')+rows+
    '<button class="act" onclick="act(\'next\')">'+(S.round>=S.rounds?'See final result':'Next round')+'</button>'+'<div class="err">'+esc(err)+'</div>';
}
function finalHtml(){
  var P=S.players.map(function(x,i){return {n:x.name,s:x.score,i:i}}),mx=Math.max.apply(null,P.map(function(x){return x.s}));
  var w=P.filter(function(x){return x.s===mx});
  var t=w.length>1?'Tie: '+w.map(function(x){return esc(x.n)}).join(' and '):esc(w[0].n)+' wins the game!';
  return '<h2>'+t+'</h2>'+P.slice().sort(function(a,b){return b.s-a.s}).map(function(x){return '<div class="row'+(x.s===mx?' win':'')+'"><b>'+esc(x.n)+'</b>: '+x.s+' points</div>'}).join('')+
    (S.you===0?'<button class="act" onclick="act(\'again\')">Play again</button>':'<div class="rule">The host can start a new game.</div>');
}
function render(){
  var ov=$('ov');
  if(!S){ov.hidden=false;ov.innerHTML=PID?'<h2>Connecting…</h2><div class="rule">If the server was asleep this can take up to a minute.</div>':homeHtml();return}
  if(S.phase==='lobby'){ov.hidden=false;ov.innerHTML=lobbyHtml();return}
  var me=S.you,P=S.players,tm=S.phase==='turn'&&S.turn===me,mine=tm&&S.step==='act',disc=tm&&S.step==='throw',need=S.pend,k=S.table.length,pk=mode==='pickone';
  $('rnd').textContent='Round '+Math.min(S.round,S.rounds)+' of '+S.rounds;
  $('scores').innerHTML=P.map(function(x,p){
    return '<div class="sc'+(S.phase==='turn'&&S.turn===p?' turn':'')+'">'+esc(x.name)+(p===me?' (you)':'')+'<b>'+x.score+'</b></div>';
  }).join('');
  $('cpus').innerHTML=P.map(function(x,p){
    return p===me?'':'<div class="chip'+(S.phase==='turn'&&S.turn===p?' turn':'')+'">'+esc(x.name)+' · '+x.count+' cards'+(x.on?'':' · offline')+'</div>';
  }).join('');
  $('deckN').textContent=S.deck+' in deck';
  $('top').innerHTML=k?S.table.map(function(c,i){return face(c,'sm'+(pk?' pick':''),pk&&mine?'onclick="act(\'takeOne\',{i:'+i+'})"':'')}).join(''):'<span class="rule">Nothing on the table</span>';
  $('tblN').textContent='On the table: '+k;
  var m=err||(pk?'Tap the table card you want.':S.msg);
  if(!err&&!pk){
    if(mine)m+=' Your turn: draw, take from the table, or declare.';
    else if(disc)m+=' Throw '+need+' card'+(need>1?'s':'')+(need>1?': tap them, then press Throw.':'.');
    else if(S.phase==='call'&&S.call&&!S.call.mine)m+=' Waiting for the other players…';
  }
  $('msg').textContent=m;
  var h=S.hand,b=best(h);
  $('tot').textContent='Your best suit: '+b.s+' '+b.t+(b.t>=40?' (enough to score)':' (need 40)');
  $('hand').className=h.length>6?'many':'';$('hand').innerHTML=h.map(function(c,i){
    var cls=(disc&&need>1)?(sel.indexOf(i)>=0?'sel':''):((c.j||c.s===b.s)?'use':'');
    return face(c,cls+(h.length>6?' sm':''),disc?'onclick="hDiscard('+i+')"':'');
  }).join('');
  var bar='';
  if(mine){
    if(S.deck)bar+='<button class="act" onclick="act(\'draw\')">Draw from deck'+(k>=5?' (wipes table)':'')+'</button>';
    if(k>0&&k<5)bar+='<button class="act alt" onclick="act(\'takeAll\')">Take the '+(k===1?'card':k+' cards')+'</button>';
    if(k>=5)bar+='<button class="act alt" onclick="act(\'takeAll\')">Take all '+k+'</button><button class="act alt" onclick="mode=\'pickone\';render()">Take one</button>';
    bar+='<button class="act alt" onclick="act(\'declare\')"'+(b.t<40||h.length!==5?' disabled':'')+'>Declare</button>';
  }else if(disc&&need>1){
    bar='<button class="act" onclick="hThrow()"'+(sel.length===need?'':' disabled')+'>Throw '+sel.length+' of '+need+'</button>';
  }
  $('bar').innerHTML=bar;$('ptr').hidden=!mine;
  if(S.phase==='call'&&S.call&&S.call.mine){ov.hidden=false;ov.innerHTML=promptHtml()}
  else if(S.phase==='reveal'){ov.hidden=false;ov.innerHTML=revealHtml()}
  else if(S.phase==='final'){ov.hidden=false;ov.innerHTML=finalHtml()}
  else ov.hidden=true;
}
function hDiscard(i){
  if(need1()){act('throw',{idx:[i]});return}
  var j=sel.indexOf(i);if(j>=0)sel.splice(j,1);else if(sel.length<S.pend)sel.push(i);render();
}
function need1(){return S.pend===1}
function hThrow(){if(sel.length===S.pend)act('throw',{idx:sel.slice()})}
(function(){
  var q=new URLSearchParams(location.search).get('code');if(q)PRE=q.toUpperCase().slice(0,4);
  try{var o=JSON.parse(localStorage.getItem('declare'));if(o){NAME=o.name||'';if(o.code&&o.pid&&(!q||q.toUpperCase()===o.code)){CODE=o.code;PID=o.pid;connect()}}}catch(e){}
  render();
})();
</script>
</body>
</html>
